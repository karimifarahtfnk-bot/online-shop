<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Shop</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold">Shop</a>

  <div class="ms-auto d-flex gap-2">
    <input id="search" class="form-control" placeholder="Search...">
    <button id="darkBtn" class="btn btn-secondary">🌙</button>

    <a href="cart.html" class="btn btn-warning position-relative">
      <i class="fas fa-shopping-cart"></i>
      <span id="cart-count" class="badge bg-danger position-absolute top-0 start-100 translate-middle">0</span>
    </a>
  </div>
</nav>
</header>

<section class="hero">
  <h1>Welcome to Our Shop</h1>
  <p>Best Products, Best Prices</p>
</section>

<section class="container mt-4">

  <div class="mb-3">
    <button class="btn btn-outline-primary filter-btn" data-cat="all">All</button>
    <button class="btn btn-outline-primary filter-btn" data-cat="fashion">Fashion</button>
    <button class="btn btn-outline-primary filter-btn" data-cat="accessory">Accessory</button>
  </div>

  <div id="products" class="row"></div>
</section>

<footer class="bg-dark text-white text-center p-3 mt-5">
  © 2026 Online Shop
</footer>

<!-- Modal -->
<div class="modal fade" id="productModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div id="modal-content" class="modal-body"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast position-fixed bottom-0 end-0 m-3" id="toast">
  <div class="toast-body bg-success text-white">Added to cart!</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
